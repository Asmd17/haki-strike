:root{
  /* Theme A (live): true black + one blood red */
  --bg:#000;--s1:#0c0c0c;--s2:#131313;--s3:#1b1b1b;
  --fg:#f2f0ec;--fg-2:#c2c0bc;--fg-3:#8a8884;--fg-4:#5a5855;
  --accent:#ff2a44;--up:#16e07a;--down:#ff3b4f;  /* PnL: vivid crypto green / red (was pastel #4fd39b / #e889b8) */
  --line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.10);--line-3:rgba(255,255,255,.16);
  --ink:#ecebe8; /* manga paper white, used for panel rules + chart line */
  --ui:"HK Geist",system-ui,sans-serif;--mono:"HK Mono",ui-monospace,monospace;--serif:"HK Serif",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
body{font-family:var(--ui);color:var(--fg);-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:675px;overflow:hidden;background:var(--bg)}
.profit{--tone:var(--up)}.loss{--tone:var(--down)}
.fit{white-space:nowrap;overflow:hidden;display:block}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-4)}
.abs{position:absolute}

/* ---------- header: lockup top-left, handles top-right ---------- */
.hd-logo{position:absolute;left:64px;top:44px;height:40px;display:block}
.hd-logo.b26{top:40px;height:48px;width:118px}   /* brand26 (1028): Logotype 48 px, same centre line as .hd-links; logo-1028b: original art, whole-px width */
.hd-links{position:absolute;right:64px;top:44px;height:40px;display:flex;align-items:center;gap:22px;font:500 15px/1 var(--ui);color:var(--fg-3);white-space:nowrap}
.hd-links span{display:inline-flex;align-items:center;gap:8px}
.hd-links svg{width:14px;height:14px;fill:var(--fg-3)}
.hd-links i{width:1px;height:14px;background:var(--line-3)}

/* ---------- token ---------- */
.tok{display:flex;align-items:center;gap:14px}
.ico{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--s3);box-shadow:0 0 0 1px var(--line-3);display:grid;place-items:center}
.ico img{width:100%;height:100%;object-fit:cover}
.ico span{font:600 20px/1 var(--ui);color:var(--fg-2)}
.tk{font:650 30px/1.05 var(--ui);letter-spacing:-.01em;color:var(--fg);max-width:420px}
.tk-sub{margin-top:5px;font:400 13px/1 var(--mono);color:var(--fg-3);letter-spacing:.01em;white-space:nowrap}

/* ---------- hero ---------- */
.big{font-family:var(--mono);font-weight:700;text-shadow:0 0 28px color-mix(in srgb,var(--tone) 16%,transparent);letter-spacing:-.05em;line-height:.9;color:var(--tone);font-variant-numeric:tabular-nums}
.sec{display:flex;gap:16px;align-items:baseline;font:700 22px/1 var(--mono);letter-spacing:-.02em;white-space:nowrap;color:var(--tone)}
.sec i{width:1px;height:18px;background:var(--line-3);align-self:center}
.sec .u{font:600 12px/1 var(--ui);letter-spacing:.12em;color:var(--fg-4);margin-left:6px}
.sec .b{color:var(--fg-2)}

/* ---------- ledger rows (A) ---------- */
.ledger{display:grid;grid-template-columns:118px 1fr}
.ledger>div{height:42px;display:flex;align-items:center;border-top:1px solid var(--line-2)}
.ledger>div:nth-last-child(-n+2){border-bottom:1px solid var(--line-2)}
.ledger .v{font:500 20px/1 var(--mono);color:var(--fg);letter-spacing:-.02em;white-space:nowrap}
.ledger .v.t{color:var(--tone)}
.ledger .v.vg{color:#f2b544}   /* share-gas amber (user 09:25 MT 10-10): gas value only; weight/size = other values */
.ledger .v.vb{color:var(--up);font-weight:600}.ledger .v.vs{color:var(--down);font-weight:600}
.ledger .v small{font:600 11px/1 var(--ui);letter-spacing:.12em;color:var(--fg-4);margin-left:8px}

/* ---------- identity footer ---------- */
.who{display:flex;align-items:center;gap:12px;white-space:nowrap;font:500 15px/1 var(--ui)}
.av{width:30px;height:30px;border-radius:50%;background:var(--s3);box-shadow:0 0 0 1px var(--line-3);display:grid;place-items:center;font:600 13px/1 var(--ui);color:var(--fg-2);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who .n{color:var(--fg)}
.who .h{color:var(--fg-3);display:inline-flex;align-items:center;gap:6px}
.who .h svg{width:12px;height:12px;fill:var(--fg-3)}
.who i{width:1px;height:14px;background:var(--line-3)}
.who .ref{color:var(--fg-4);font-size:13px;letter-spacing:.02em}
.who .ref b{font:600 13px/1 var(--mono);letter-spacing:.12em;color:var(--fg-2);margin-left:8px}

/* ---------- art ---------- */
.guts{position:absolute;display:block;pointer-events:none}
.tag{font:600 30px/1 var(--serif);letter-spacing:-.005em;color:#d8d6d2}

/* ---------- chart ---------- */
svg.ch{position:absolute;overflow:visible}
.ch .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch .base{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 4}
.mk text{font:700 11px/1 var(--mono);text-anchor:middle;dominant-baseline:central}
.mk .stem{stroke-width:1}
.ch .area{stroke:none}

/* ================= A · LEDGER (chart runs behind Guts) ================= */
.A .tok{position:absolute;left:64px;top:128px}
.A .big{position:absolute;left:62px;top:206px;width:600px}
.A .sec{position:absolute;left:64px;top:316px}
.A .ledger{position:absolute;left:64px;top:372px;width:340px}
.A .ledger.r5>div{height:38px}
/* pnlc2 (1102, owner: "the card: I like it, but something is off" + "drop the B×3, show the actual buys and sells"): the chart lives
   in the dark column under one stats line instead of floating between the rows and the art; sentence-case labels. hk_pnlc2_off = old card */
.A .ledger.st2{top:368px;width:476px;display:grid;grid-template-columns:none;grid-template-rows:auto auto;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);column-gap:20px;padding:16px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.A .ledger.st2>div{height:auto;border:0}
.A .ledger.st2 .lbl{font:500 14px/1 var(--ui);letter-spacing:0;text-transform:none;color:var(--fg-3);margin-bottom:10px}
.A .ledger.st2 .v{font-size:21px}
.A .ledger.st2 .v small{margin-left:5px;letter-spacing:.04em}
.A .who{position:absolute;left:64px;bottom:44px}
.guts-art.A svg.ch{left:420px;top:334px;width:330px;height:206px}
.flow-art.A .tag{right:auto;left:664px;font:700 26px/1 var(--ui);letter-spacing:-.02em;color:#e9e7e3}
.A .tag{position:absolute;right:450px;bottom:40px;font-size:28px;color:#d8d6d2}
.A .tag.sans{font:700 26px/1 var(--ui);letter-spacing:-.02em;color:#e9e7e3}

/* ================= B · PANELS (manga page) ================= */
.B .pn{position:absolute;border:1.5px solid rgba(236,235,232,.78);overflow:hidden;background:#000}
.B .p1{left:40px;top:100px;width:574px;height:294px}
.B .p2{left:40px;top:406px;width:574px;height:178px}
.B .p3{left:626px;top:100px;width:534px;height:484px}
.B .p1 .tok{position:absolute;left:28px;top:26px}
.B .p1 .big{position:absolute;left:26px;top:96px;width:520px}
.B .p1 .sec{position:absolute;left:28px;top:192px;font-size:20px}
.B .stats{position:absolute;left:0;right:0;bottom:0;height:0}
.B .p2 svg.ch{left:24px;top:34px;width:526px;height:122px}
.B .p2 .lbl{position:absolute;left:24px;top:16px}
.B .p2 .rng{position:absolute;right:22px;top:16px;font:500 11px/1 var(--mono);color:var(--fg-4);letter-spacing:.06em}
.flow-art .cap{top:auto!important;bottom:18px;font:700 24px/1 var(--ui)!important;letter-spacing:-.02em}
.B .cap{position:absolute;left:18px;top:18px;background:#ecebe8;color:#0a0a0a;font:650 26px/1 var(--serif);padding:12px 16px 14px;border:1.5px solid #000;box-shadow:0 0 0 1.5px rgba(236,235,232,.78)}
.B .row4{position:absolute;left:40px;top:596px;width:574px;display:grid;grid-template-columns:repeat(4,1fr)}
.B .who{position:absolute;left:40px;top:600px;height:36px}
.B .refr{position:absolute;right:40px;top:600px;height:36px;display:flex;align-items:center;gap:22px;font:500 13px/1 var(--ui);color:var(--fg-4);white-space:nowrap}
.B .refr b{font:600 13px/1 var(--mono);letter-spacing:.12em;color:var(--fg-2);margin-left:8px}
.B .row4>div{display:none}
.B .ks{position:absolute;left:28px;right:28px;top:226px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line-2);padding-top:12px}
.B .ks .lbl{font-size:10px}
.B .ks .v{margin-top:7px;font:500 17px/1 var(--mono);color:var(--fg);letter-spacing:-.02em;white-space:nowrap}

/* ===== animated card: art=rose (video art in a window, layout A) ===== */
.rose-art.A .big{width:520px}

/* 3.12.20 (owner 1120 picked B): the white Solana mark before a SOL amount, no disc; centred on the digits (HK Mono digits = .74em tall,
   centre .37em above the baseline: bottom = .37em - half the mark's height) */
.sv{white-space:nowrap}
.sb{display:inline-block;width:.62em;height:.486em;margin-right:.2em;vertical-align:.127em;flex:none}

/* ===== v14 · full-bleed arts (art=sniper | grave) =====
   The painting covers the right of the card; one scrim layer (left fade to solid black + a bottom fade under the chart
   strip + a light top fade under the handles) guarantees every number sits on pure black. The figure is never covered. */
.bleed{position:absolute;display:block;max-width:none;pointer-events:none}
.scrim{position:absolute;inset:0;pointer-events:none}

/* ===== v14 · kind=1d (one-day card in layout A: the ledger becomes the day's trades) ===== */

.ledger.d1 .tk1{font:650 17px/1 var(--ui);color:var(--fg);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.ledger.d1 .am{justify-content:flex-end;font:600 17px/1 var(--mono);letter-spacing:-.02em;white-space:nowrap}
